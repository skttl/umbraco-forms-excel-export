name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.7"
          archive="actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" | sha256sum --check
          tar -xzf "$archive" actionlint
      - name: Run actionlint
        run: ./actionlint -shellcheck= -pyflakes= .github/workflows/*.yml

  test:
    name: Test Forms ${{ matrix.forms-major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        forms-major: [17, 18]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Umbraco.Community.Forms.ExcelExport.slnx -p:UmbracoFormsMajor=${{ matrix.forms-major }}
      - name: Build
        run: dotnet build Umbraco.Community.Forms.ExcelExport.slnx --no-restore -c Release -p:UmbracoFormsMajor=${{ matrix.forms-major }}
      - name: Test
        run: dotnet test Umbraco.Community.Forms.ExcelExport.slnx --no-restore -c Release -p:UmbracoFormsMajor=${{ matrix.forms-major }}
      - name: Pack
        run: dotnet pack src/Umbraco.Community.Forms.ExcelExport/Umbraco.Community.Forms.ExcelExport.csproj --no-restore -c Release -p:UmbracoFormsMajor=${{ matrix.forms-major }} -p:PackageVersion=${{ matrix.forms-major }}.0.0 -o artifacts/${{ matrix.forms-major }}
      - name: Validate package contents
        shell: bash
        run: |
          set -euo pipefail
          test -f "artifacts/${{ matrix.forms-major }}/Umbraco.Community.Forms.ExcelExport.${{ matrix.forms-major }}.0.0.nupkg"
          test -f "artifacts/${{ matrix.forms-major }}/Umbraco.Community.Forms.ExcelExport.${{ matrix.forms-major }}.0.0.snupkg"

  latest-compatible:
    name: Latest compatible Forms ${{ matrix.forms-major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - forms-major: 17
            forms-version: 17.5.0
          - forms-major: 18
            forms-version: 18.1.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore latest compatible Forms
        run: dotnet restore Umbraco.Community.Forms.ExcelExport.slnx -p:UmbracoFormsMajor=${{ matrix.forms-major }} -p:UmbracoFormsVersion=${{ matrix.forms-version }}
      - name: Build latest compatible Forms
        run: dotnet build Umbraco.Community.Forms.ExcelExport.slnx --no-restore -c Release -p:UmbracoFormsMajor=${{ matrix.forms-major }} -p:UmbracoFormsVersion=${{ matrix.forms-version }}
      - name: Test latest compatible Forms
        run: dotnet test Umbraco.Community.Forms.ExcelExport.slnx --no-restore -c Release -p:UmbracoFormsMajor=${{ matrix.forms-major }} -p:UmbracoFormsVersion=${{ matrix.forms-version }}
