name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Validate tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "$version" =~ ^(17|18)\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag must be v17.x.y or v18.x.y with an optional prerelease suffix."
            exit 1
          fi
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "forms-major=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Restore
        run: dotnet restore Umbraco.Community.Forms.ExcelExport.slnx -p:UmbracoFormsMajor=${{ steps.version.outputs.forms-major }}
      - name: Build
        run: dotnet build Umbraco.Community.Forms.ExcelExport.slnx --no-restore -c Release -p:UmbracoFormsMajor=${{ steps.version.outputs.forms-major }}
      - name: Test
        run: dotnet test Umbraco.Community.Forms.ExcelExport.slnx --no-restore -c Release -p:UmbracoFormsMajor=${{ steps.version.outputs.forms-major }}
      - name: Pack with release version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MANIFEST: src/Umbraco.Community.Forms.ExcelExport/wwwroot/App_Plugins/UmbracoCommunityFormsExcelExport/umbraco-package.json
        run: |
          set -euo pipefail
          backup="$(mktemp)"
          manifest_tmp="$(mktemp)"
          cp "$MANIFEST" "$backup"

          restore_manifest() {
            cp "$backup" "$MANIFEST"
            rm -f "$backup" "$manifest_tmp"
          }
          trap restore_manifest EXIT

          jq --arg version "$VERSION" '.version = $version' "$MANIFEST" > "$manifest_tmp"
          cp "$manifest_tmp" "$MANIFEST"

          dotnet pack src/Umbraco.Community.Forms.ExcelExport/Umbraco.Community.Forms.ExcelExport.csproj \
            --no-restore -c Release \
            -p:UmbracoFormsMajor=${{ steps.version.outputs.forms-major }} \
            -p:PackageVersion="$VERSION" -o artifacts

          restore_manifest
          trap - EXIT
          git diff --exit-code -- "$MANIFEST"
      - name: Validate package contents
        shell: bash
        run: |
          set -euo pipefail
          package="artifacts/Umbraco.Community.Forms.ExcelExport.${{ steps.version.outputs.version }}.nupkg"
          test -f "$package"
          test -f "artifacts/Umbraco.Community.Forms.ExcelExport.${{ steps.version.outputs.version }}.snupkg"

          manifest="$(unzip -p "$package" wwwroot/App_Plugins/UmbracoCommunityFormsExcelExport/umbraco-package.json)"
          jq -e --arg version "${{ steps.version.outputs.version }}" '
            .id == "Umbraco.Community.Forms.ExcelExport" and
            .name == "Umbraco Community Forms Excel Export" and
            .version == $version and
            ([.extensions[] | select(.type == "localization")] | length == 2) and
            ([.extensions[].alias] | unique | length == 2) and
            ([.extensions[].js] | sort) == [
              "/App_Plugins/UmbracoCommunityFormsExcelExport/lang/da-DK.js",
              "/App_Plugins/UmbracoCommunityFormsExcelExport/lang/en.js"
            ] and
            ([.extensions[].meta.culture] | sort) == ["da-DK", "en"]
          ' <<< "$manifest"

          unzip -t "$package" \
            wwwroot/App_Plugins/UmbracoCommunityFormsExcelExport/umbraco-package.json \
            wwwroot/App_Plugins/UmbracoCommunityFormsExcelExport/lang/en.js \
            wwwroot/App_Plugins/UmbracoCommunityFormsExcelExport/lang/da-DK.js
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/Umbraco.Community.Forms.ExcelExport.${{ steps.version.outputs.version }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            args=(--generate-notes --verify-tag)
            if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
            gh release create "$TAG" artifacts/* "${args[@]}" --title "$TAG"
          fi
